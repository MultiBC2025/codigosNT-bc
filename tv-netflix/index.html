<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Servicio - MultiBC</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 12px; min-height: 100vh; background-color: #0b0b0b; margin: 0; padding: 24px 12px; color: #fff; }
        .card { background: #1c1c1e; padding: 28px 24px; border-radius: 16px; width: 100%; max-width: 460px; text-align: center; box-shadow: 0 14px 34px rgba(0,0,0,.55); border: 1px solid #2e2e30; border-top: 4px solid #e50914; animation: aparecer .35s ease; }
        @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes girar { to { transform: rotate(360deg); } }
        @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes sacudir { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
        @keyframes puntos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
        h1, h2, h3 { margin: 8px 0 10px; line-height: 1.25; }
        h2 { font-size: 24px; }
        p { color: #d4d4d8; line-height: 1.5; }
        .header-info { font-size: 12px; color: #a1a1aa; margin-bottom: 18px; border-bottom: 1px solid #2e2e30; padding-bottom: 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .badge-vence { display: inline-block; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; color: #fff; white-space: nowrap; }
        .badge-verde { background: #16a34a; }
        .badge-amarillo { background: #eab308; color: #1c1c1e; }
        .badge-rojo { background: #dc2626; }
        .banner-vence { background: #422006; border: 1px solid #eab308; border-radius: 10px; padding: 13px 14px; font-size: 14px; font-weight: 700; color: #fde68a; margin: 0 0 16px; line-height: 1.55; }
        .btn-whatsapp { display: inline-block; width: 100%; padding: 13px; background: #25d366; color: #06281a; border-radius: 10px; font-weight: 800; font-size: 16px; text-decoration: none; margin-top: 10px; text-align: center; }
        .btn-whatsapp:hover { background: #1eb85a; }
        .btn-whatsapp-chico { width: auto; padding: 9px 16px; font-size: 14px; }
        .icono-suspendida { font-size: 56px; margin-top: 8px; }
        .caja-suspendida { background: #450a0a; border: 1px solid #dc2626; border-radius: 12px; padding: 16px; margin: 14px 0; }
        input { width: 100%; padding: 14px 12px; margin: 14px 0 6px; border: 2px solid #3f3f46; border-radius: 10px; background: #0b0b0b; color: #fff; text-align: center; font-size: 26px; letter-spacing: 6px; font-weight: 800; outline: none; }
        input:focus { border-color: #e50914; }
        input::placeholder { color: #52525b; letter-spacing: 2px; font-size: 18px; }
        .contador { font-size: 13px; color: #a1a1aa; margin: 4px 0 10px; }
        button { width: 100%; padding: 13px; background: #e50914; color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: .25s; margin-top: 8px; }
        button:hover:not(:disabled) { background: #b20710; transform: translateY(-1px); }
        button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
        .btn-hogar { background: linear-gradient(135deg, #d63384, #a61e6b); }
        .btn-hogar:hover:not(:disabled) { background: linear-gradient(135deg, #c2257a, #8e1a5c); }
        .btn-secundario { background: #2e2e30; border: 1px solid #3f3f46; }
        .aviso { background: #26262a; border-left: 4px solid #e50914; border-radius: 10px; padding: 13px 14px; text-align: left; font-size: 14px; color: #e4e4e7; margin: 14px 0; line-height: 1.55; }
        .aviso strong { color: #fff; }
        .aviso ol { margin: 8px 0 0; padding-left: 20px; }
        .alerta { background: #422006; border: 1px solid #eab308; color: #fde68a; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 700; margin: 14px 0; line-height: 1.5; }
        .detalle { background: #0b0b0b; border: 1px solid #2e2e30; border-radius: 12px; padding: 6px 16px; margin: 16px 0; text-align: left; }
        .detalle p { display: flex; justify-content: space-between; gap: 12px; margin: 12px 0; font-size: 15px; }
        .detalle b { color: #a1a1aa; font-weight: 600; }
        .detalle span { color: #fff; font-weight: 700; text-align: right; word-break: break-word; }
        .spinner { width: 64px; height: 64px; margin: 18px auto 10px; border-radius: 50%; border: 5px solid #2e2e30; border-top-color: #e50914; animation: girar .9s linear infinite; }
        .spinner-chico { width: 34px; height: 34px; margin: 12px auto 6px; border-width: 4px; }
        .cargando-texto { animation: pulso 1.4s ease-in-out infinite; }
        .icono-error { font-size: 52px; display: inline-block; animation: sacudir .55s ease; margin-top: 8px; }
        .icono-ok { font-size: 52px; }
        .seccion-hogar { margin-top: 20px; border-top: 1px solid #2e2e30; padding-top: 18px; }
        .hogar-titulo { font-size: 15px; font-weight: 800; color: #fff; margin: 0 0 6px; }
        .hogar-texto { font-size: 14px; color: #d4d4d8; margin: 6px 0; }
        .codigo-hogar { font-size: 44px; font-weight: 900; letter-spacing: 12px; background: #000; border: 2px solid #e50914; border-radius: 12px; padding: 14px 10px 14px 22px; margin: 12px 0 6px; }
        .caja-ok { background: #052e16; border: 1px solid #16a34a; border-radius: 10px; padding: 13px; font-weight: 700; }
        .caja-error { background: #450a0a; border: 1px solid #dc2626; border-radius: 10px; padding: 13px; font-weight: 700; }
        .footer { margin-top: 20px; font-size: 12px; color: #71717a; }
        a { color: #f87171; }
        .enlace-volver { display: inline-block; margin-top: 14px; }
        .tema-switch { display: flex; gap: 6px; background: #1c1c1e; border: 1px solid #2e2e30; border-radius: 999px; padding: 6px; }
        .tema-btn { width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0; background: transparent; color: #a1a1aa; }
        .tema-btn:hover:not(.activo) { background: #2e2e30; color: #fff; }
        .tema-btn.activo { background: #e50914; color: #fff; }
        .btn-soporte { display: block; width: 100%; max-width: 460px; padding: 13px; background: #25d366; color: #06281a; border-radius: 10px; font-weight: 800; font-size: 15px; text-align: center; text-decoration: none; }
        .btn-soporte:hover { background: #1eb85a; }
        /* Tema claro: fondo claro y letras oscuras */
        body.tema-claro { background-color: #f4f4f9; color: #1c1c1e; }
        body.tema-claro .card { background: #fff; color: #1c1c1e; border-color: #e5e7eb; box-shadow: 0 10px 25px rgba(0,0,0,.1); }
        body.tema-claro h1, body.tema-claro h2, body.tema-claro h3, body.tema-claro .hogar-titulo { color: #111; }
        body.tema-claro p, body.tema-claro .hogar-texto { color: #374151; }
        body.tema-claro .header-info { color: #666; border-color: #eee; }
        body.tema-claro input { background: #fff; color: #111; border-color: #ddd; }
        body.tema-claro input::placeholder { color: #9ca3af; }
        body.tema-claro .aviso { background: #f9fafb; color: #374151; }
        body.tema-claro .aviso strong { color: #111; }
        body.tema-claro .detalle { background: #f4f4f9; border-color: #e5e7eb; }
        body.tema-claro .detalle b { color: #6b7280; }
        body.tema-claro .detalle span { color: #111; }
        body.tema-claro .spinner { border-color: #e5e7eb; border-top-color: #e50914; }
        body.tema-claro .seccion-hogar { border-color: #e5e7eb; }
        body.tema-claro .footer { color: #888; }
        body.tema-claro .tema-switch { background: #fff; border-color: #e5e7eb; }
        body.tema-claro .tema-btn { color: #6b7280; }
        body.tema-claro .tema-btn.activo { background: #e50914; color: #fff; }
        body.tema-claro .caja-ok { background: #e8f5e9; color: #2e7d32; }
        body.tema-claro .caja-error, body.tema-claro .caja-suspendida { background: #fdecea; color: #b71c1c; }
        body.tema-claro .banner-vence, body.tema-claro .alerta { background: #fef3c7; color: #92400e; border-color: #eab308; }
        body.tema-claro a { color: #b20710; }
        body.tema-claro .btn-whatsapp, body.tema-claro .btn-soporte { color: #06281a; }
    </style>
</head>
<body>

<div class="tema-switch" role="group" aria-label="Tema de la página">
    <button type="button" class="tema-btn" data-tema="claro" onclick="cambiarTema('claro')">☀️ Claro</button>
    <button type="button" class="tema-btn" data-tema="oscuro" onclick="cambiarTema('oscuro')">🌙 Oscuro</button>
</div>

<div class="card" id="contenido">
    <h1>Cargando...</h1>
</div>

<a class="btn-soporte" href="https://wa.me/573503938788?text=Hola%2C%20tengo%20problemas%20para%20acceder%20a%20mi%20cuenta%20Netflix%20TV%2C%20%C2%BFme%20puedes%20ayudar%3F" target="_blank" rel="noopener">🆘 Tengo problemas para acceder a mi cuenta</a>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBZKmJQ7TcszQeBu--3jK4sxA3F3tAF_N8", 
        authDomain: "panel-cuentas-clientes.firebaseapp.com", 
        projectId: "panel-cuentas-clientes" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const idVenta = urlParams.get('id');

    // Estado local: no se guarda en Firestore. Sirve para no reenviar
    // dos veces la misma solicitud y para medir los 10 minutos / 3 minutos
    // aunque la fecha del servidor todavía no haya llegado.
    let ultimoDoc = null;
    let ultimoId = null;
    let enviandoTV = false;
    let hogarEnCurso = false;
    let hogarIntentos = 0;
    let ultimoClickHogarMs = 0;
    let hogarClickLocalMs = 0;
    let mostrarAdvertenciaHogar = false;
    let ultimaVistaHogar = "";
    // Registro en vivo (logs_codigos, misma colección del panel admin):
    // una fila por intento de código TV, que se va actualizando en la
    // misma fila, sin crear registros nuevos. Al actualizar también se
    // refresca el timestamp para que la fila quede de primera.
    let idLogActual = null;
    let textoLogActual = "";
    let promesaLogActual = null;
    let estadoAnteriorTV = null;
    let estadoHogarAnterior = null;

    if (idVenta) {
        iniciarEscucha(idVenta);
    } else {
        mostrarFormulario();
    }

    function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    // Fecha corta para el registro, ej. 06/11/2026 8:13 p. m.
    function fechaCortaLog() {
        try {
            return new Date().toLocaleString("es-CO", { day: "2-digit", month: "2-digit", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
        } catch (e) {
            return new Date().toLocaleString();
        }
    }

    // Misma función que usa la página grande (botón amarillo / morado):
    // escribe en logs_codigos, que es lo que pinta el Registro de
    // Actividad en Vivo del panel admin. Devuelve la promesa con el ref.
    function registrarEventoCodigo(nombre, correo, plataforma, codigo) {
        if (typeof db !== "undefined") {
            return db.collection("logs_codigos").add({
                nombre_cliente: nombre || "Cliente Panel",
                correo_cuenta: correo,
                plataforma: plataforma,
                codigo_visto: codigo,
                fecha: fechaCortaLog(),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then((ref) => { return ref; })
            .catch((error) => { console.log("No se pudo registrar el log.", error); });
        }
        return null;
    }

    function correoDoc(d) {
        if (!d) return "";
        return d.correo || d.correo_cuenta || "";
    }

    // Crea la fila del intento actual: código entre comillas y fecha/hora
    // corta entre paréntesis, ej. "12345678" (06/11/2026 8:13 p. m.)
    function crearLogActual(linea) {
        if (typeof textoLogActual !== "undefined") textoLogActual = linea;
        idLogActual = null;
        try {
            const d = ultimoDoc || {};
            const promesa = registrarEventoCodigo(nombreCliente(d), correoDoc(d), "NETFLIX TV", linea);
            promesaLogActual = promesa;
            if (promesa && promesa.then) {
                promesa.then(function (ref) {
                    if (ref && ref.id) idLogActual = ref.id;
                });
            }
        } catch (e) {
            console.log("No se pudo registrar el log.", e);
        }
    }

    // Actualiza la MISMA fila: la línea nueva va encima, con <br>,
    // y se refresca fecha y timestamp para que quede de primera.
    // Si todavía no hay fila (página recargada), crea una nueva.
    function actualizarLogActual(lineaNueva) {
        if (typeof textoLogActual === "undefined") textoLogActual = "";
        if (idLogActual) {
            textoLogActual = lineaNueva + "<br>" + textoLogActual;
            try {
                db.collection("logs_codigos").doc(idLogActual).update({
                    codigo_visto: textoLogActual,
                    fecha: fechaCortaLog(),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.log("No se pudo actualizar el log.", e);
            }
            return;
        }
        if (promesaLogActual && promesaLogActual.then) {
            promesaLogActual.then(function (ref) {
                if (ref && ref.id) {
                    idLogActual = ref.id;
                    textoLogActual = lineaNueva + "<br>" + textoLogActual;
                    try {
                        db.collection("logs_codigos").doc(idLogActual).update({
                            codigo_visto: textoLogActual,
                            fecha: fechaCortaLog(),
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch (e2) {
                        console.log("No se pudo actualizar el log.", e2);
                    }
                } else {
                    crearLogActual(lineaNueva);
                }
            });
            return;
        }
        crearLogActual(lineaNueva);
    }

    // Tema claro / oscuro: se guarda en el navegador para que quede igual
    // la próxima vez que abra la página. Por defecto, oscuro.
    function actualizarBotonesTema() {
        const tema = document.body.classList.contains("tema-claro") ? "claro" : "oscuro";
        document.querySelectorAll(".tema-btn").forEach(function (b) {
            b.classList.toggle("activo", b.dataset.tema === tema);
        });
    }
    function cambiarTema(tema) {
        document.body.classList.toggle("tema-claro", tema === "claro");
        try { localStorage.setItem("temaMultiBC", tema); } catch (e) {}
        actualizarBotonesTema();
    }
    (function () {
        let guardado = "oscuro";
        try { guardado = localStorage.getItem("temaMultiBC") || "oscuro"; } catch (e) {}
        if (guardado !== "claro" && guardado !== "oscuro") guardado = "oscuro";
        document.body.classList.toggle("tema-claro", guardado === "claro");
        actualizarBotonesTema();
    })();

    function mostrarFormulario() {
        document.getElementById('contenido').innerHTML = `
            <h3>Acceso de Cliente</h3>
            <p>Escribe tu código de servicio para ver tu cuenta.</p>
            <input type="text" id="codigoInput" placeholder="Ingresa tu código de servicio" style="font-size:16px; letter-spacing:1px;">
            <button onclick="buscarPorCodigo()">Ver mi Servicio</button>
        `;
    }

    async function buscarPorCodigo() {
        const codigo = document.getElementById('codigoInput').value.trim();
        if (codigo) window.location.href = `?id=${encodeURIComponent(codigo)}`;
    }

    function iniciarEscucha(id) {
        db.collection("cuentas").doc(id).onSnapshot((doc) => {
            if (!doc.exists) {
                document.getElementById('contenido').innerHTML = "<h3>Código no válido.</h3><a class='enlace-volver' href='.'>Volver</a>";
                return;
            }
            const dNuevo = doc.data();
            const estadoNuevo = dNuevo.estado || "";
            const estadoHogarNuevo = dNuevo.estado_hogar || "";
            // --- Registro en vivo: código TV, misma fila hasta el resultado ---
            if (estadoAnteriorTV === "procesando" && estadoNuevo === "tv-activo") {
                actualizarLogActual("✅ Éxito - Perfil " + esc(dNuevo.perfil || "—") + " - PIN " + esc(dNuevo.pin || "—") + " (" + fechaCortaLog() + ")");
                // Ya salió éxito: se deja de actualizar esta fila.
                idLogActual = null; textoLogActual = ""; promesaLogActual = null;
            } else if (estadoAnteriorTV === "procesando" && (estadoNuevo === "error-netflix" || estadoNuevo === "error-conexion")) {
                const detalle = estadoNuevo === "error-conexion" ? "Error de conexión" : "Código incorrecto o error de servidor";
                actualizarLogActual("❌ Error - " + detalle + " (" + fechaCortaLog() + ")");
                idLogActual = null; textoLogActual = ""; promesaLogActual = null;
            }
            // --- Registro en vivo: hogar, fila propia creada al solicitar ---
            if (estadoHogarAnterior === "procesando" && estadoHogarNuevo === "confirmado") {
                actualizarLogActual("✅ Hogar autorizado (" + fechaCortaLog() + ")");
                idLogActual = null; textoLogActual = ""; promesaLogActual = null;
            } else if (estadoHogarAnterior === "procesando" && estadoHogarNuevo === "codigo-temporal") {
                actualizarLogActual("✅ Código temporal: " + esc(dNuevo.codigo_temporal || "••••") + " (" + fechaCortaLog() + ")");
                idLogActual = null; textoLogActual = ""; promesaLogActual = null;
            } else if (estadoHogarAnterior === "procesando" && estadoHogarNuevo === "error-hogar") {
                actualizarLogActual("❌ Error hogar (" + fechaCortaLog() + ")");
                idLogActual = null; textoLogActual = ""; promesaLogActual = null;
            }
            estadoAnteriorTV = estadoNuevo;
            estadoHogarAnterior = estadoHogarNuevo;
            ultimoDoc = dNuevo;
            ultimoId = doc.id;
            renderizar(ultimoDoc, ultimoId);
        }, (error) => {
            document.getElementById('contenido').innerHTML = "<h3>Error de conexión</h3><p>No pudimos cargar tu servicio. Revisa tu conexión e inténtalo de nuevo.</p>";
        });
    }

    function titularTexto(d) {
        const etiqueta = String(d.perfil_etiqueta || "").trim();
        if (!etiqueta) return "Cliente";
        const partes = etiqueta.split(". ");
        return (partes.length > 1 ? partes[1] : etiqueta).trim() || "Cliente";
    }

    function nombreCliente(d) {
        const titular = titularTexto(d);
        const partes = titular.split(" - ");
        const nombre = (partes.length > 1 ? partes[partes.length - 1] : titular).trim();
        return nombre || "Cliente";
    }

    function fechaToMs(valor) {
        if (valor == null) return null;
        if (typeof valor.toDate === "function") return valor.toDate().getTime();
        if (typeof valor === "object" && typeof valor.seconds === "number") return valor.seconds * 1000;
        if (valor instanceof Date) return valor.getTime();
        const t = new Date(valor).getTime();
        return isNaN(t) ? null : t;
    }

    function parseFechaFin(valor) {
        if (valor == null) return null;
        if (typeof valor.toDate === "function") return valor.toDate();
        if (valor instanceof Date) return valor;
        if (typeof valor === "number") return new Date(valor);
        const texto = String(valor).trim();
        // Formato guardado en la página: DD/MM/YYYY (ej. 03/12/2026)
        const m = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), 23, 59, 59);
        // Formato real de Firestore en tus documentos: YYYY-MM-DD (ej. 2026-12-03).
        // Se lee como día local completo (hasta las 23:59), no como medianoche UTC,
        // para que no marque vencida un día antes en hora de Colombia.
        const iso = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]), 23, 59, 59);
        const f = new Date(texto);
        return isNaN(f.getTime()) ? null : f;
    }

    function badgeVence(d) {
        const fin = parseFechaFin(d.fin);
        if (!fin) return { clase: "badge-verde", texto: "Vence en —" };
        const dias = Math.ceil((fin.getTime() - Date.now()) / (1000 * 60 * 60 * 24));
        if (dias > 5) return { clase: "badge-verde", texto: "Vence en " + dias + "d" };
        if (dias >= 1) return { clase: "badge-amarillo", texto: "Vence en " + dias + "d" };
        if (dias === 0) return { clase: "badge-rojo", texto: "Vence hoy" };
        return { clase: "badge-rojo", texto: "Vencido" };
    }

    // --- Vencimiento: bloqueo total y advertencia ---
    // Vencida = hoy ya pasó el último día completo de "fin".
    // Ej.: fin 03/12/2026 y hoy 04/12/2026 -> vencida. Fin hoy -> todavía no.
    // Si "fin" no se puede leer, no se bloquea: no se castiga por un dato malo.
    function estaVencida(d) {
        const fin = parseFechaFin(d.fin);
        if (!fin) return false;
        return Date.now() > fin.getTime();
    }

    function diasRestantes(d) {
        const fin = parseFechaFin(d.fin);
        if (!fin) return null;
        return Math.ceil((fin.getTime() - Date.now()) / (1000 * 60 * 60 * 24));
    }

    function urlRenovar() {
        return "https://wa.me/573503938788?text=" + encodeURIComponent("Hola, quiero renovar mi cuenta Netflix TV.");
    }

    // Advertencia solo cuando faltan 5 días o menos (5, 4, 3, 2, 1 y hoy).
    function bannerVencimiento(d) {
        if (estaVencida(d)) return "";
        const dias = diasRestantes(d);
        if (dias == null || dias > 5) return "";
        const texto = dias <= 0 ? "Tu cuenta vence hoy." : "Tu cuenta vence en " + dias + (dias === 1 ? " día." : " días.");
        return `<div class="banner-vence">⚠️ ${texto} Renuévala a tiempo para no perder el acceso.<br><a class="btn-whatsapp btn-whatsapp-chico" href="${urlRenovar()}" target="_blank" rel="noopener">💬 Renovar por WhatsApp</a></div>`;
    }

    // Pantalla de bloqueo total: sin código TV, sin perfil, sin PIN y sin hogar.
    function pantallaSuspendida(d) {
        return `
            <div class="icono-suspendida">⛔</div>
            <h2>Cuenta suspendida por falta de pago</h2>
            <p>Hola, ${esc(nombreCliente(d))}.</p>
            <div class="caja-suspendida">
                <p><strong>Tu cuenta está suspendida por falta de pago.</strong></p>
                <p>Por favor, contáctate con nosotros para renovar la cuenta.</p>
                <p>Fecha fin: <strong>${esc(d.fin || "—")}</strong></p>
            </div>
            <a class="btn-whatsapp" href="${urlRenovar()}" target="_blank" rel="noopener">💬 Renovar por WhatsApp</a>
            <div class="footer">MultiEntretenimiento BC</div>`;
    }

    // --- Código TV: solo números, máximo 8 ---
    function soloNumerosTV(input) {
        const limpio = input.value.replace(/\D/g, "").slice(0, 8);
        if (input.value !== limpio) input.value = limpio;
        const contador = document.getElementById("contadorTv");
        if (contador) contador.textContent = limpio.length + " / 8 dígitos";
        const boton = document.getElementById("btnContinuarTv");
        if (boton) boton.disabled = limpio.length !== 8;
    }

    function bloquearTeclaTV(e) {
        const permitidas = ["Backspace", "Delete", "Tab", "ArrowLeft", "ArrowRight", "Home", "End"];
        if (permitidas.includes(e.key) || e.ctrlKey || e.metaKey) return;
        if (!/^[0-9]$/.test(e.key)) e.preventDefault();
    }

    function pegarCodigoTV(e) {
        e.preventDefault();
        const texto = (e.clipboardData || window.clipboardData).getData("text") || "";
        const input = e.target;
        input.value = texto.replace(/\D/g, "").slice(0, 8);
        soloNumerosTV(input);
        input.focus();
    }

    function renderizar(d, id) {
        const contenido = document.getElementById('contenido');
        // Bloqueo total si ya venció: no importa el estado, no se muestra
        // código TV, perfil, PIN ni hogar. Solo la pantalla de suspendida.
        if (estaVencida(d)) {
            contenido.innerHTML = pantallaSuspendida(d);
            return;
        }
        const badge = badgeVence(d);
        const header = `<div class="header-info"><span>Inicio: ${esc(d.inicio || "—")}</span><span>Fin: ${esc(d.fin || "—")}</span><span class="badge-vence ${badge.clase}">${esc(badge.texto)}</span></div>`;

        switch (d.estado) {
            case "desconectado":
                contenido.innerHTML = `${header}
                    ${bannerVencimiento(d)}
                    <h2>Hola, ${esc(nombreCliente(d))}</h2>
                    <p>Confirma el código TV que aparece en tu TV Netflix:</p>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="codeTv" placeholder="12345678" maxlength="8" oninput="soloNumerosTV(this)" onkeydown="bloquearTeclaTV(event)" onpaste="pegarCodigoTV(event)">
                    <div class="contador" id="contadorTv">0 / 8 dígitos</div>
                    <div class="aviso">
                        <strong>¿Dónde está el código?</strong>
                        <ol>
                            <li>En tu televisor, abre Netflix.</li>
                            <li>Dale en <strong>Iniciar sesión</strong>.</li>
                            <li>Elige usar el <strong>código TV</strong>.</li>
                            <li>Escribe aquí, en esta sección, el código de <strong>8 números</strong> que te muestra el televisor y dale en <strong>Continuar</strong>.</li>
                        </ol>
                        Solo se permiten números, sin letras ni espacios.
                    </div>
                    <button id="btnContinuarTv" disabled onclick="actualizarEstado('${esc(id)}', 'procesando')">Continuar</button>
                    <div class="footer">MultiEntretenimiento BC</div>`;
                break;
            case "procesando":
                contenido.innerHTML = `${header}
                    ${bannerVencimiento(d)}
                    <div class="spinner" role="status" aria-label="Cargando"></div>
                    <h2 class="cargando-texto">Conectando con nuestro servidor...</h2>
                    <p>Estamos conectándonos con nuestro servidor para vincular tu cuenta a tu televisor.</p>
                    <p><strong>Te estaremos avisando cuando quede listo.</strong><br>No cierres esta página.</p>
                    <div class="footer">MultiEntretenimiento BC</div>`;
                break;
            case "tv-activo":
                contenido.innerHTML = `${header}
                    <h2>¡Bienvenido, ${esc(nombreCliente(d))}!</h2>
                    <p><strong>Tu cuenta está configurada exitosamente en tu televisor.</strong></p>
                    ${bannerVencimiento(d)}
                    <div class="detalle">
                        <p><b>Titular:</b> <span>${esc(titularTexto(d))}</span></p>
                        <p><b>Perfil:</b> <span>${esc(d.perfil || "—")}</span></p>
                        <p><b>PIN:</b> <span>${esc(d.pin || "—")}</span></p>
                        <p><b>Inicio:</b> <span>${esc(d.inicio || "—")}</span></p>
                        <p><b>Fin:</b> <span>${esc(d.fin || "—")}</span></p>
                    </div>
                    ${seccionHogar(d, id)}
                    <div class="footer">MultiEntretenimiento BC</div>`;
                break;
            case "error-netflix":
                contenido.innerHTML = `${header}
                    ${bannerVencimiento(d)}
                    <div class="icono-error">⚠️</div>
                    <h2>Código incorrecto o error de servidor</h2>
                    <p><strong>Por favor intenta de nuevo.</strong></p>
                    <p>Recuerda escribir correctamente, abajo, el código de 8 números que muestra tu televisor, sin letras ni espacios.</p>
                    <button onclick="actualizarEstado('${esc(id)}', 'desconectado')">Continuar</button>
                    <div class="footer">MultiEntretenimiento BC</div>`;
                break;
            case "error-conexion":
                contenido.innerHTML = `${header}
                    ${bannerVencimiento(d)}
                    <div class="icono-error">⚠️</div>
                    <h2>Código incorrecto o error de servidor</h2>
                    <p><strong>Por favor intenta de nuevo.</strong></p>
                    <p>No pudimos conectar con el servidor. Recuerda escribir correctamente el código de 8 números que muestra tu televisor.</p>
                    <button onclick="actualizarEstado('${esc(id)}', 'desconectado')">Continuar</button>
                    <div class="footer">MultiEntretenimiento BC</div>`;
                break;
            default:
                contenido.innerHTML = `${header}
                    ${bannerVencimiento(d)}
                    <h2>Hola, ${esc(nombreCliente(d))}</h2>
                    <p>Confirma el código TV que aparece en tu TV Netflix:</p>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="codeTv" placeholder="12345678" maxlength="8" oninput="soloNumerosTV(this)" onkeydown="bloquearTeclaTV(event)" onpaste="pegarCodigoTV(event)">
                    <div class="contador" id="contadorTv">0 / 8 dígitos</div>
                    <button id="btnContinuarTv" disabled onclick="actualizarEstado('${esc(id)}', 'procesando')">Continuar</button>`;
                break;
        }
    }

    function vistaHogar(d) {
        const estadoHogar = d.estado_hogar || "";
        let fechaMs = fechaToMs(d.fechaRegistroHogar);
        if (!fechaMs && estadoHogar === "procesando" && hogarClickLocalMs) fechaMs = hogarClickLocalMs;
        const edadMin = fechaMs ? (Date.now() - fechaMs) / 60000 : 0;
        if (estadoHogar === "procesando" && edadMin > 10) return "timeout";
        if (estadoHogar === "procesando") return "buscando";
        if (estadoHogar === "codigo-temporal") {
            const edadSeg = fechaMs ? (Date.now() - fechaMs) / 1000 : 0;
            return edadSeg <= 180 ? "codigo" : "codigo-expirado";
        }
        if (estadoHogar === "confirmado") return "confirmado";
        // Error viejo: si fechaRegistroHogar (fecha y hora completas) ya tiene
        // más de 10 minutos, no se muestra el error, vuelve el botón.
        // Si tiene menos de 10 minutos, sí se muestra. Sin fecha, se muestra
        // porque no se puede saber si ya pasaron 10 minutos.
        if (estadoHogar === "error-hogar") {
            if (fechaMs && edadMin > 10) return "boton";
            return "error-hogar";
        }
        return "boton";
    }

    function botonHogar(id) {
        return `<button id="btnHogar" class="btn-hogar" onclick="solicitarHogar('${esc(id)}')">🔑 Activar Hogar / Código temp</button>`;
    }

    function alertaHogar() {
        if (!mostrarAdvertenciaHogar) return "";
        return `<div class="alerta">⚠️ Por favor, solamente una solicitud a la vez para evitar bloqueos en la cuenta y en el servidor.</div>`;
    }

    function seccionHogar(d, id) {
        const estadoHogar = d.estado_hogar || "";
        const vista = vistaHogar(d);
        ultimaVistaHogar = vista;

        if (estadoHogar === "confirmado") hogarEnCurso = false;
        if (estadoHogar === "error-hogar" || estadoHogar === "codigo-expirado") hogarEnCurso = false;
        if (vista === "timeout" || vista === "codigo-expirado") hogarEnCurso = false;

        let cuerpo = "";

        if (vista === "buscando") {
            cuerpo = `
                <div class="spinner spinner-chico" role="status" aria-label="Buscando hogar"></div>
                <p class="hogar-titulo cargando-texto">Buscando y autorizando hogar...</p>
                <p class="hogar-texto">Estamos buscando la solicitud en tu correo y autorizándola. No cierres esta página.</p>
                ${alertaHogar()}`;
        } else if (vista === "timeout") {
            cuerpo = `
                <p class="hogar-texto">La solicitud tardó más de 10 minutos. Puedes intentarlo de nuevo.</p>
                ${botonHogar(id)}
                ${alertaHogar()}`;
        } else if (vista === "codigo") {
            let fechaMs = fechaToMs(d.fechaRegistroHogar) || hogarClickLocalMs;
            const restantes = fechaMs ? Math.max(0, 180 - Math.floor((Date.now() - fechaMs) / 1000)) : 180;
            cuerpo = `
                <p class="hogar-titulo">✅ Código temporal listo</p>
                <p class="hogar-texto">Usa este código para ver Netflix en tu televisor. No compartas ninguna URL, solo este código.</p>
                <div class="codigo-hogar">${esc(d.codigo_temporal || "••••")}</div>
                <p class="hogar-texto" id="hogarCuenta">Este código se ocultará en ${restantes} segundos.</p>
                ${alertaHogar()}`;
        } else if (vista === "codigo-expirado") {
            cuerpo = `
                <p class="hogar-texto">El código temporal ya no se muestra porque pasaron 3 minutos. Si lo necesitas de nuevo, pide otra solicitud.</p>
                ${botonHogar(id)}
                ${alertaHogar()}`;
        } else if (vista === "confirmado") {
            cuerpo = `
                <div class="caja-ok">✅ Hogar autorizado. Tu hogar ya quedó actualizado, puedes volver a ver Netflix en tu televisor.</div>
                <div style="margin-top:12px;">${botonHogar(id)}</div>
                ${alertaHogar()}`;
        } else if (vista === "error-hogar") {
            cuerpo = `
                <div class="caja-error">❌ No se pudo autorizar el hogar. Por favor intenta de nuevo.</div>
                <div style="margin-top:12px;">${botonHogar(id)}</div>
                ${alertaHogar()}`;
        } else {
            cuerpo = `${botonHogar(id)}${alertaHogar()}`;
        }

        return `<div class="seccion-hogar">${cuerpo}</div>`;
    }

    // Revisa cada 5 segundos si ya pasaron los 10 minutos buscando
    // o los 3 minutos del código, sin hacer lecturas nuevas a Firestore.
    setInterval(function () {
        if (!ultimoDoc || !ultimoId || ultimoDoc.estado !== "tv-activo") return;
        const vistaAhora = vistaHogar(ultimoDoc);
        if (vistaAhora !== ultimaVistaHogar) {
            renderizar(ultimoDoc, ultimoId);
            return;
        }
        if (vistaAhora === "codigo") {
            const el = document.getElementById("hogarCuenta");
            let fechaMs = fechaToMs(ultimoDoc.fechaRegistroHogar) || hogarClickLocalMs;
            if (el && fechaMs) {
                const restantes = Math.max(0, 180 - Math.floor((Date.now() - fechaMs) / 1000));
                el.textContent = "Este código se ocultará en " + restantes + " segundos.";
            }
        }
    }, 5000);

    async function actualizarEstado(id, est) {
        if (est === "procesando") {
            if (enviandoTV) return;
            const input = document.getElementById("codeTv");
            const codigo = input ? input.value.replace(/\D/g, "").slice(0, 8) : "";
            if (codigo.length !== 8) {
                if (input) input.focus();
                return;
            }
            enviandoTV = true;
            const boton = document.getElementById("btnContinuarTv");
            if (boton) boton.disabled = true;
            // Registro en vivo: se crea la fila del intento con el código
            // entre comillas y la fecha/hora corta entre paréntesis.
            // Cada intento nuevo (y cada día nuevo) crea su propia fila.
            crearLogActual('"' + codigo + '" (' + fechaCortaLog() + ')');
            try {
                await db.collection("cuentas").doc(id).update({ estado: est, codigo_tv: codigo });
            } catch (e) {
                enviandoTV = false;
                if (boton) boton.disabled = false;
            }
            return;
        }
        enviandoTV = false;
        await db.collection("cuentas").doc(id).update({ estado: est });
    }

    async function solicitarHogar(id) {
        const ahora = Date.now();

        // Segunda solicitud seguida: no se vuelve a escribir, solo se avisa.
        if (hogarEnCurso) {
            mostrarAdvertenciaHogar = true;
            if (ultimoDoc && ultimoId) renderizar(ultimoDoc, ultimoId);
            return;
        }
        if (hogarIntentos > 0 && ahora - ultimoClickHogarMs < 60000) {
            mostrarAdvertenciaHogar = true;
            if (ultimoDoc && ultimoId) renderizar(ultimoDoc, ultimoId);
            return;
        }
        if (ahora - ultimoClickHogarMs > 60000) hogarIntentos = 0;

        hogarIntentos += 1;
        ultimoClickHogarMs = ahora;
        hogarClickLocalMs = ahora;
        hogarEnCurso = true;
        mostrarAdvertenciaHogar = false;

        const boton = document.getElementById("btnHogar");
        if (boton) boton.disabled = true;

        // Registro en vivo: al solicitar hogar/código por correo se crea
        // una fila NUEVA (no se reutiliza la del código TV), con el
        // mismo formato. Su resultado la actualiza en la misma fila.
        crearLogActual("🔑 Hogar solicitado (" + fechaCortaLog() + ")");

        try {
            // Solo se escribe el aviso para la Raspberry. No se llama a
            // ningún servicio externo desde el navegador y no se recibe
            // ninguna URL. La Raspberry es la que lee el correo y autoriza.
            await db.collection("cuentas").doc(id).update({
                estado_hogar: "procesando",
                fechaRegistroHogar: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (e) {
            hogarEnCurso = false;
            mostrarAdvertenciaHogar = true;
            if (ultimoDoc && ultimoId) renderizar(ultimoDoc, ultimoId);
        }
    }
</script>
